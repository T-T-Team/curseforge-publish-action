name: CurseForge Publish Action
description: Publishes mods to CurseForge via official API
author: Toma

branding:
  icon: align-justify
  color: blue

inputs:
  artifact-directory:
    required: false
    description: 'Location with GitHub artifacts'
    default: "artifacts"
  token:
    required: true
    description: 'Token for uploading to CurseForge'
  project-id:
    required: true
    description: 'Your project ID'
  changelog-content:
    required: false
    description: 'Changelog content for this release'
    default: ""
  changelog-type:
    required: false
    description: 'Changelog format, defaults to Markdown'
    default: "markdown"
  release-channel:
    required: false
    description: 'Allows you to set release channel such as release, beta, alpha. If empty it is resolved from filename based on -beta/-alpha suffix'
    default: ""
  game-version:
    required: false
    description: 'Comma separated string with Minecraft game version numbers. Such as 26.2,26.1.2,... If empty it is resolved from filename based on +xx.x suffix'
    default: ''
  game-environment:
    required: false
    description: 'Comma separated string with environments where this mod is required such as client or server. By default uses both client,server'
    default: "client,server"
  mod-loader:
    required: false
    description: 'Comma separated list of loaders to be used for the upload file. Example: neoforge,forge,fabric,... If empty it is attempted to be resolved from filename based on -fabric/-neoforge/... file content'
    default: ''
  java-version:
    required: false
    description: 'Comma separated string with java versions this mod uses'
    default: ""
  required-dependencies:
    required: false
    description: 'Comma separated list of required project dependencies'
    default: ""
  optional-dependencies:
    required: false
    description: 'Comma separated list of optional project dependencies'
    default: ""
  embedded-dependencies:
    required: false
    description: 'Comma separated list of embedded project dependencies'
    default: ""
  incompatible-dependencies:
    required: false
    description: 'Comma separated list of incompatible projects'
    default: ""
  tool-dependencies:
    required: false
    description: 'Comma separated list of tool type projects'
    default: ""
  debug-mode:
    required: false
    description: 'For debugging purposes, when enabled no files are actually uploaded to CurseForge'
    default: "false"

outputs:
  version-id:
    description: 'The version ID of uploaded file'

runs:
  using: node24
  main: dist/index.js